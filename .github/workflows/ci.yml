name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Build and test
        run: gradle build --no-daemon
      - name: Demo smoke test (train + classify + benchmark, in-memory model)
        run: gradle :demo:run --no-daemon --args="benchmark --runs 50"
